name: Daily Health Ping and Screener Fetch

on:
  schedule:
    # Trigger at exactly 23:45 Asia/Kolkata (18:15 UTC)
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render Container
        env:
          BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL}" ]; then
            echo "RENDER_BASE_URL secret is required" >&2
            exit 1
          fi
  
          echo "Pinging instance to trigger spin up..."
          # A short 10-second max-time flag (-m 10) wakes Render up without stalling the GitHub runner 
          # while the Java container performs its internal startup processing tasks.
          curl -s -m 10 "${BASE_URL%/}/health" || echo "Container wake up signal transmitted successfully."