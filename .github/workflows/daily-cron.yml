name: Daily Health Ping and Screener Fetch

on:
  schedule:
    # 23:50 Asia/Kolkata = 18:20 UTC
    - cron: '20 18 * * *'
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint to wake the service
        env:
          BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL}" ]; then
            echo "RENDER_BASE_URL secret is required" >&2
            exit 1
          fi

          call_with_retry() {
            local method="$1"
            local url="$2"
            local data="${3:-}"
            local attempt=1
            while [ "$attempt" -le 6 ]; do
              if [ -n "${data}" ]; then
                if curl -fsS -X "$method" "$url" -H "Content-Type: application/json" -d "$data"; then
                  return 0
                fi
              else
                if curl -fsS "$url"; then
                  return 0
                fi
              fi
              attempt=$((attempt + 1))
              sleep 10
            done
            return 1
          }

          call_with_retry GET "${BASE_URL%/}/health"
          echo

      - name: Trigger Screener fetch
        env:
          BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL}" ]; then
            echo "RENDER_BASE_URL secret is required" >&2
            exit 1
          fi
          call_with_retry() {
            local method="$1"
            local url="$2"
            local data="${3:-}"
            local attempt=1
            while [ "$attempt" -le 6 ]; do
              if curl -fsS -X "$method" "$url" -H "Content-Type: application/json" -d "$data"; then
                return 0
              fi
              attempt=$((attempt + 1))
              sleep 10
            done
            return 1
          }

          call_with_retry POST "${BASE_URL%/}/api/cron/fetch-screener" '{}'


